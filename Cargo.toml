[package]
name = "sipc"
version = "0.1.0"
authors = ["randi <randyjunior2011@live.com>"]
edition = "2024"
description = "A SIP command line tool"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive", "cargo"] }
tokio = { version = "1.41.1", features = ["rt", "macros", "signal"] }
uuid = "1.23.1"
rssip = { git = "https://github.com/randijunior/rssip" }
tracing = "0.1.41"
tracing-subscriber = {version = "0.3", features = ["env-filter", "chrono"]}